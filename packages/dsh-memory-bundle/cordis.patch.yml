# dsh-memory-bundle patch layer.
# Applied after the dsh-base insert; rows here override base rows by id.
#
# Disables the base plain unicode61 session-query provider and the base
# compaction backend, then inserts the dsh-memory plugin set. Paths are
# relative so they resolve against the invoking workspace (headless) — use
# absolute paths in a real deployment.

- id: session-query-sqlite
  disabled: true

# NOTE: compaction-basic is intentionally left enabled.
# dsh-token-optimizer's compactionDriver depends on it; a second compaction
# service (compaction-locator) would collide and crash boot. Locators are
# not shipped in this profile; summary tracing is done by the base engine.

- insert:
    - id: session-query-sqlite-cjk
      name: dsh-session-query-sqlite-cjk
      config:
        # Absolute under DSH_HOME: survives workspace changes; the derived
        # index is disposable and recreated on first search.
        path: C:/Users/羊/.dsh/dsh-memory/session-query-cjk.db
        openAt: first-search

    - id: tool-result-dedup
      name: dsh-tool-result-dedup
      config:
        maxCacheBytes: 131072

    - id: memory-index
      name: dsh-memory-index
      config:
        path: C:/Users/羊/.dsh/dsh-memory/memory-index.db
        embedder:
          kind: char-overlap
        dims: 512

    - id: memory-tool
      name: dsh-memory-tool

    - id: memory-core
      name: dsh-memory-core
      config:
        path: C:/Users/羊/.dsh/dsh-memory/memory-core.db

    - id: memory-skills
      name: dsh-memory-skills
      config:
        path: C:/Users/羊/.dsh/dsh-memory/memory-skills.db

